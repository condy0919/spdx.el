name: "Check for license list version"
on:
  schedule:
    - cron: '0 0 * * *'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v3
      with:
        fetch-depth: 0

    - name: Install Emacs
      uses: purcell/setup-emacs@master
      with:
        version: 29.1

    - name: Setup Git
      run: |
        git config --global user.email "condy0919@gmail.com"
        git config --global user.name "condy"

    - name: Update license list
      run: |
        previous_commit=$(git rev-parse HEAD)
        ./admin/spdx-update.sh
        if [[ "$(git rev-parse HEAD)" != "$previous_commit" ]]; then
          git push origin master
        fi
